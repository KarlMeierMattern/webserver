openapi: "3.0.3"
info:
  title: Chirpy API
  version: "1.0.0"
servers:
  - url: http://localhost:8080

paths:
  /api/healthz:
    get:
      summary: Readiness check
      responses:
        "200":
          description: Server is up
          content:
            application/json:
              schema:
                type: string
                example: OK

  /api/validate_chirp:
    post:
      summary: Validate and filter a chirp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - body
              properties:
                body:
                  type: string
                  example: I had something interesting for breakfast
      responses:
        "200":
          description: Chirp is valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  cleanedBody:
                    type: string
                    example: I had something interesting for breakfast
        "400":
          description: Invalid chirp
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Chirp is too long

  /admin/metrics:
    get:
      summary: View file server hit count
      responses:
        "200":
          description: HTML page showing hit count
          content:
            text/html:
              schema:
                type: string

  /admin/reset:
    post:
      summary: Reset file server hit count to zero
      responses:
        "200":
          description: Hit count reset
          content:
            application/json:
              schema:
                type: object
                properties:
                  fileServerHits:
                    type: integer
                    example: 0
